<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Student — SMS App</title>
  <meta name="description" content="Edit and update student information in the Student Management System" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<div class="app-layout">
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleMobileSidebar()"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="/images/logo.svg" alt="SMS Logo" class="logo-img" />
      <div class="logo-text">
        <h3>SMS App</h3>
        <span>Management System</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-title">Main Menu</div>
      <a href="/dashboard" class="nav-link"><i class="fa fa-gauge-high"></i> Dashboard</a>
      <a href="/students" class="nav-link active"><i class="fa fa-users"></i> Students</a>
      <a href="/add-student" class="nav-link"><i class="fa fa-user-plus"></i> Add Student</a>
    </nav>
    <div class="sidebar-user">
      <button class="sidebar-logout-full-btn" onclick="handleLogout()">
        <i class="fa fa-right-from-bracket"></i> Logout
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" onclick="toggleMobileSidebar()" aria-label="Toggle menu">
          <i class="fa fa-bars"></i>
        </button>
        <div>
          <h1>Edit Student</h1>
          <div class="breadcrumb">Dashboard / Students / <span id="student-name-breadcrumb">Edit</span></div>
        </div>
      </div>
      <div class="topbar-right">
        <a href="/students" class="btn btn-secondary btn-sm">
          <i class="fa fa-arrow-left"></i> Back to Students
        </a>
      </div>
    </header>

    <main class="page-content">
      <!-- Loading State -->
      <div id="loading-state" style="text-align:center; padding:60px; color:var(--text-muted)">
        <i class="fa fa-spinner fa-spin" style="font-size:32px; margin-bottom:12px; display:block;"></i>
        Loading student data...
      </div>

      <!-- Error State -->
      <div id="error-state" style="display:none; text-align:center; padding:60px; color:#f87171;">
        <i class="fa fa-circle-xmark" style="font-size:48px; margin-bottom:12px; display:block; opacity:0.5;"></i>
        <p style="font-size:16px; margin-bottom:16px">Student not found</p>
        <a href="/students" class="btn btn-secondary">Back to Students</a>
      </div>

      <!-- Alert -->
      <div id="form-alert" style="
        display:none;
        padding: 12px 18px;
        border-radius: 10px;
        font-size: 13px;
        margin-bottom: 20px;
        font-weight: 500;
      "></div>

      <!-- Form -->
      <div class="form-card" id="edit-form-card" style="display:none">
        <div class="section-header" style="margin-bottom:24px">
          <div>
            <h2 style="font-size:17px">Update Student Information</h2>
            <p>Modify the fields and click <strong style="color:var(--warning)">Update Student</strong> to save changes</p>
          </div>
          <div class="user-avatar" id="student-avatar" style="width:48px;height:48px;font-size:18px;">S</div>
        </div>

        <form id="edit-student-form" onsubmit="handleUpdate(event)">
          <input type="hidden" id="student-id" />
          <div class="form-grid">
            <div class="form-group">
              <label for="name">Full Name <span class="required">*</span></label>
              <input type="text" id="name" name="name" placeholder="e.g. Rahul Kumar" required />
            </div>

            <div class="form-group">
              <label for="email">Email Address <span class="required">*</span></label>
              <input type="email" id="email" name="email" placeholder="e.g. rahul@email.com" required />
            </div>

            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phone" placeholder="e.g. 9876543210" maxlength="15" />
            </div>

            <div class="form-group">
              <label for="course">Course / Department</label>
              <select id="course" name="course">
                <option value="">— Select Course —</option>
                <option>Computer Science</option>
                <option>Information Technology</option>
                <option>Electronics Engineering</option>
                <option>Mechanical Engineering</option>
                <option>Civil Engineering</option>
                <option>Data Science</option>
                <option>Artificial Intelligence</option>
                <option>Business Administration</option>
                <option>Commerce</option>
                <option>Arts & Humanities</option>
                <option>Medicine</option>
                <option>Law</option>
                <option>Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="gender">Gender</label>
              <select id="gender" name="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="dob">Date of Birth</label>
              <input type="date" id="dob" name="dob" />
            </div>

            <div class="form-group full-width">
              <label for="address">Address</label>
              <textarea id="address" name="address" placeholder="City, State, Country"></textarea>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-warning" id="update-btn">
              <i class="fa fa-floppy-disk"></i> Update Student
            </button>
            <a href="/students" class="btn btn-secondary">
              <i class="fa fa-xmark"></i> Cancel
            </a>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
  async function init() {
    // Auth check
    const sRes = await fetch('/api/session');
    const sData = await sRes.json();
    if (!sData.loggedIn) { window.location.href = '/login'; return; }

    // Get student id from URL
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (!id) { showError(); return; }

    // Load student data
    try {
      const res = await fetch(`/api/students/${id}`);
      const data = await res.json();
      if (!data.success) { showError(); return; }
      populateForm(data.data);
    } catch (e) {
      showError();
    }
  }

  function populateForm(student) {
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('edit-form-card').style.display = 'block';

    const initials = student.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2);
    document.getElementById('student-avatar').textContent = initials;
    document.getElementById('student-name-breadcrumb').textContent = student.name;

    document.getElementById('student-id').value = student.id;
    document.getElementById('name').value = student.name;
    document.getElementById('email').value = student.email;
    document.getElementById('phone').value = student.phone || '';
    document.getElementById('address').value = student.address || '';
    document.getElementById('gender').value = student.gender || 'Male';

    if (student.dob) {
      document.getElementById('dob').value = student.dob.split('T')[0];
    }

    // Set course dropdown
    const courseSelect = document.getElementById('course');
    for (let opt of courseSelect.options) {
      if (opt.value === student.course) {
        opt.selected = true;
        break;
      }
    }
    // If custom course not in list
    if (student.course && !Array.from(courseSelect.options).some(o => o.value === student.course)) {
      const opt = document.createElement('option');
      opt.value = student.course;
      opt.textContent = student.course;
      opt.selected = true;
      courseSelect.appendChild(opt);
    }

    document.getElementById('dob').max = new Date().toISOString().split('T')[0];
  }

  function showError() {
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('error-state').style.display = 'block';
  }

  async function handleUpdate(e) {
    e.preventDefault();
    const btn = document.getElementById('update-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Updating...';
    hideAlert();

    const id = document.getElementById('student-id').value;
    const payload = {
      name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      course: document.getElementById('course').value,
      gender: document.getElementById('gender').value,
      dob: document.getElementById('dob').value,
      address: document.getElementById('address').value.trim()
    };

    try {
      const res = await fetch(`/api/students/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.success) {
        showAlert(`✅ ${data.message}`, 'success');
        showToast(data.message, 'success');
        setTimeout(() => window.location.href = '/students', 1500);
      } else {
        showAlert(`❌ ${data.message}`, 'error');
        showToast(data.message, 'error');
      }
    } catch (err) {
      showAlert('❌ Network error. Please try again.', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa fa-floppy-disk"></i> Update Student';
    }
  }

  function showAlert(msg, type) {
    const el = document.getElementById('form-alert');
    el.textContent = msg;
    el.style.display = 'block';
    if (type === 'success') {
      el.style.background = 'rgba(16,185,129,0.15)';
      el.style.border = '1px solid rgba(16,185,129,0.3)';
      el.style.color = '#059669';
    } else {
      el.style.background = 'rgba(239,68,68,0.10)';
      el.style.border = '1px solid rgba(239,68,68,0.3)';
      el.style.color = '#dc2626';
    }
  }

  function hideAlert() {
    document.getElementById('form-alert').style.display = 'none';
  }

  function showToast(msg, type = 'success') {
    const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `<i class="fa ${icons[type]}"></i><span>${msg}</span>`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
  }

  async function handleLogout() {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/login';
  }

  function toggleMobileSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    sidebar.classList.toggle('open');
    overlay.classList.toggle('active');
  }

  init();
</script>

</body>
</html>
