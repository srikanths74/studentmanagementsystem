<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Main Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Inner Shadow/Highlight -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>

  <!-- Rounded Rectangle Base -->
  <rect x="5" y="5" width="90" height="90" rx="24" ry="24" fill="url(#bgGrad)" filter="url(#glow)"/>
  
  <!-- Subtle Overlay Border -->
  <rect x="5" y="5" width="90" height="90" rx="24" ry="24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Graduation Cap Icon -->
  <g transform="translate(50, 48)">
    <!-- Cap Diamond Top -->
    <polygon points="0,-22 28,-9 0,4 -28,-9" fill="url(#capGrad)"/>
    
    <!-- Cap Underneath Base -->
    <path d="M-18,-4 L-18,10 C-18,16 18,16 18,10 L18,-4 C12,3 -12,3 -18,-4 Z" fill="#ffffff" opacity="0.85"/>
    
    <!-- Tassel String -->
    <path d="M20,-11 C23,-6 24,2 24,12" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Tassel Bulb/Pendant -->
    <circle cx="24" cy="14" r="3.5" fill="#fbbf24"/>
  </g>
</svg>
